<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="purandarGradBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9254" />
      <stop offset="45%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#F94A29" />
    </linearGradient>
    <linearGradient id="redGradBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5C5C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <!-- Outer Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#badgeBg)" stroke="url(#goldRing)" stroke-width="4"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="#2B2D38" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Top Crown / Fort Motif representing Purandar -->
  <g transform="translate(150, 48)">
    <path d="M-24 16 L-16 0 L-6 12 L0 -4 L6 12 L16 0 L24 16 Z" fill="url(#goldRing)"/>
    <circle cx="0" cy="22" r="2.5" fill="#FCD34D"/>
  </g>

  <!-- Main Word "पुरंदर" -->
  <g transform="translate(150, 126)">
    <text text-anchor="middle" font-family="'Yatra One', 'Noto Sans Devanagari', sans-serif" 
          font-size="64" font-weight="900" letter-spacing="1"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round">पुरंदर</text>
    <text text-anchor="middle" font-family="'Yatra One', 'Noto Sans Devanagari', sans-serif" 
          font-size="64" font-weight="900" letter-spacing="1"
          fill="url(#purandarGradBadge)">पुरंदर</text>
  </g>

  <!-- Subtitle Line "बिर्याणी हाऊस अँड चायनिज" -->
  <g transform="translate(150, 172)">
    <text text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" 
          font-size="22" font-weight="800"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">बिर्याणी हाऊस अँड चायनिज</text>
    <text text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" 
          font-size="22" font-weight="800"
          fill="url(#redGradBadge)">बिर्याणी हाऊस अँड चायनिज</text>
  </g>

  <!-- Bottom Divider Ribbon -->
  <path d="M70 200 L230 200" stroke="url(#goldRing)" stroke-width="1.5"/>
  <circle cx="150" cy="200" r="4" fill="#F59E0B"/>

  <!-- English Tag -->
  <text x="150" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="11" font-weight="800" letter-spacing="2" fill="#E2E8F0">BIRYANI &amp; CHINESE</text>
  <text x="150" y="242" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="9" font-weight="700" letter-spacing="2" fill="#94A3B8">PUNE • ESTD</text>
</svg>